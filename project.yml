name: BinFlow
options:
  bundleIdPrefix: com.aswin
  deploymentTarget:
    iOS: "17.0"
targets:
  BinFlow:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: CAMPXWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aswin.binflow
        PRODUCT_NAME: BinFlow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Config/AppInfo.plist
        GENERATE_INFOPLIST_FILE: NO
  CAMPXWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [WidgetExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aswin.binflow.widget
        PRODUCT_NAME: CAMPXWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        INFOPLIST_FILE: Config/WidgetInfo.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
